
name: Open Library Automation Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  # ========================================
  # API TESTS
  # ========================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-html

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API tests
        run: |
          python -m pytest tests/api/ \
            -v \
            --html=reports/api-report.html \
            --self-contained-html

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: reports/api-report.html
          if-no-files-found: warn

  # ========================================
  # UI TESTS
  # ========================================
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-html

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run UI tests
        run: |
          python -m pytest tests/ui/ \
            -v \
            --browser chromium \
            --screenshot only-on-failure \
            --tracing retain-on-failure \
            --output test-results/ui \
            --html=reports/ui-report.html \
            --self-contained-html

      - name: Upload UI report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            reports/ui-report.html
            test-results/ui/
          if-no-files-found: warn

  # ========================================
  # INTEGRATION TESTS
  # ========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-html

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            -v \
            --browser chromium \
            --screenshot only-on-failure \
            --tracing retain-on-failure \
            --output test-results/integration \
            --html=reports/integration-report.html \
            --self-contained-html

      - name: Upload integration report and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: |
            reports/integration-report.html
            test-results/integration/
          if-no-files-found: warn
