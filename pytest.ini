[pytest]
testpaths = tests 

python_files = test_*.py
python_functions = test_*

addopts = 
    -v 
    --browser chromium 
    --tracing retain-on-failure 
    --screenshot only-on-failure
    --base-url https://openlibrary.org

markers =
    ui: UI browser tests
    api: API endpoint tests
    integration: API and UI integration tests
